<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor Multi-ZIP eSocial (Consolidado Anual)</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
  <style>
    :root {
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 40px 20px; display: flex; justify-content: center; }
    .container { max-width: 900px; width: 100%; }
    header { margin-bottom: 24px; text-align: center; }
    h1 { font-size: 1.75rem; color: var(--text-main); font-weight: 700; margin-bottom: 8px; }
    p.subtitle { color: var(--text-muted); font-size: 0.95rem; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
    
    .dropzone {
      border: 2px dashed #cbd5e1; border-radius: 8px; padding: 40px 20px; text-align: center; background: #f1f5f9; cursor: pointer; transition: all 0.2s;
    }
    .dropzone:hover, .dropzone.dragover { border-color: var(--primary); background: #eff6ff; }
    .dropzone p { color: var(--text-muted); font-size: 0.9rem; margin-top: 8px; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; background: var(--primary); color: white; border: none; padding: 12px 24px;
      font-size: 0.95rem; font-weight: 600; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; margin-top: 16px;
    }
    .btn:hover { background-color: var(--primary-hover); }
    .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }

    .progress-box { margin-top: 16px; display: none; }
    .progress-bar-bg { background: #e2e8f0; height: 10px; border-radius: 5px; overflow: hidden; margin-bottom: 8px; }
    .progress-bar-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.1s; }
    .status-text { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between; }

    .log-box {
      background: #0f172a; color: #38bdf8; font-family: monospace; font-size: 0.8rem; padding: 12px; border-radius: 6px; height: 230px; overflow-y: auto; margin-top: 16px; display: none; white-space: pre-wrap;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Leitor Multi-ZIP eSocial (Consolidado Anual)</h1>
    <p class="subtitle">Selecione múltiplos arquivos ZIP (ex: os 12 meses do ano) para mapeamento global de rubricas.</p>
  </header>

  <div class="card">
    <div class="dropzone" id="dropzone">
      <strong style="color: var(--primary);">Selecione ou arraste um ou VÁRIOS arquivos .ZIP aqui</strong>
      <p>Você pode selecionar os 12 pacotes ZIP do ano de uma só vez!</p>
      <input type="file" id="fileInput" accept=".zip,.ZIP" multiple style="display:none;">
    </div>

    <div class="progress-box" id="progressBox">
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>
      <div class="status-text">
        <span id="statusLabel">Lendo estrutura dos ZIPs...</span>
        <span id="statusPercent">0%</span>
      </div>
    </div>

    <div class="log-box" id="logBox"></div>

    <button class="btn" id="startBtn" disabled>Processar Lotes ZIP e Gerar Excel Consolidado</button>
  </div>
</div>

<script>
  const DE_PARA_VERBAS = {
    "1020": "Aviso Prévio Indenizado",
    "1022": "Terço Constitucional de Férias",
    "1004": "Ajuda de Custo",
    "1009": "Ressarcimento de Despesas / EPI",
    "1050": "Salário Maternidade",
    "6000": "Indenização / Rescisão Contratual",
    "6001": "Indenização Art. 477 CLT",
    "6002": "Indenização Art. 479 CLT"
  };

  const fileInput = document.getElementById('fileInput');
  const dropzone = document.getElementById('dropzone');
  const startBtn = document.getElementById('startBtn');
  const progressBox = document.getElementById('progressBox');
  const progressFill = document.getElementById('progressFill');
  const statusLabel = document.getElementById('statusLabel');
  const statusPercent = document.getElementById('statusPercent');
  const logBox = document.getElementById('logBox');

  let selectedFiles = [];

  dropzone.addEventListener('click', () => fileInput.click());
  dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
  dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
  dropzone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropzone.classList.remove('dragover');
    if (e.dataTransfer.files.length > 0) {
      selectedFiles = Array.from(e.dataTransfer.files).filter(f => f.name.toLowerCase().endsWith('.zip'));
      updateFileInputLabel();
    }
  });

  fileInput.addEventListener('change', (e) => {
    if (e.target.files.length > 0) {
      selectedFiles = Array.from(e.target.files).filter(f => f.name.toLowerCase().endsWith('.zip'));
      updateFileInputLabel();
    }
  });

  function updateFileInputLabel() {
    if (selectedFiles.length > 0) {
      const totalSizeMB = (selectedFiles.reduce((acc, f) => acc + f.size, 0) / (1024 * 1024)).toFixed(1);
      dropzone.querySelector('strong').innerText = `${selectedFiles.length} arquivo(s) ZIP selecionado(s) (${totalSizeMB} MB total)`;
      startBtn.disabled = false;
    }
  }

  function log(msg, color = '#38bdf8') {
    logBox.style.display = 'block';
    logBox.innerHTML += `<div style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
    logBox.scrollTop = logBox.scrollHeight;
  }

  function queryNodes(parent, localName) {
    if (!parent) return [];
    const results = [];
    const all = parent.getElementsByTagName('*');
    for (let i = 0; i < all.length; i++) {
      if (all[i].localName === localName || all[i].tagName.endsWith(':' + localName) || all[i].tagName === localName) {
        results.push(all[i]);
      }
    }
    return results;
  }

  function getNodeVal(parent, localName) {
    const nodes = queryNodes(parent, localName);
    return nodes.length > 0 ? nodes[0].textContent.trim() : '';
  }

  startBtn.addEventListener('click', async () => {
    try {
      startBtn.disabled = true;
      progressBox.style.display = 'block';
      logBox.innerHTML = '';
      log(`Iniciando processamento consolidado de ${selectedFiles.length} pacote(s) ZIP...`);

      const parser = new DOMParser();
      const rubricasMap = new Map();
      const linhasPlanilha = [];

      // PASSO 1: Indexar e Mapear TODAS as Rubricas S-1010 de TODOS os ZIPs
      log("Etapa 1/2: Construindo Catálogo Global de Rubricas S-1010 de todos os ZIPs...");
      let zipIndex = 0;

      for (let zipFile of selectedFiles) {
        zipIndex++;
        log(`Indexando ZIP ${zipIndex}/${selectedFiles.length}: ${zipFile.name}...`);
        
        try {
          const zip = await JSZip.loadAsync(zipFile);
          const allEntries = Object.keys(zip.files).filter(fileName => !zip.files[fileName].dir);

          let countInZip = 0;
          for (let fileName of allEntries) {
            countInZip++;

            try {
              const xmlText = await zip.files[fileName].async('string');

              if (xmlText.includes('evtTabRubrica') || xmlText.includes('infoRubrica')) {
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                const evts = queryNodes(xmlDoc, 'evtTabRubrica').concat(queryNodes(xmlDoc, 'infoRubrica'));

                evts.forEach(evt => {
                  const codRubr = getNodeVal(evt, 'codRubr');
                  const dscRubr = getNodeVal(evt, 'dscRubr');
                  const natRubr = getNodeVal(evt, 'natRubr');

                  if (codRubr) {
                    const verbaIndenizatoria = DE_PARA_VERBAS[natRubr] || "Verba Remuneratória / Outros";
                    rubricasMap.set(codRubr, {
                      descricao: dscRubr,
                      natureza: natRubr,
                      verbaIndenizatoria: verbaIndenizatoria
                    });
                  }
                });
              }
            } catch (e) {}

            if (countInZip % 3000 === 0 || countInZip === allEntries.length) {
              const pct = Math.round(((zipIndex - 1 + (countInZip / allEntries.length)) / selectedFiles.length) * 35);
              progressFill.style.width = `${pct}%`;
              statusPercent.innerText = `${pct}%`;
              statusLabel.innerText = `Mapeando Rubricas (${zipIndex}/${selectedFiles.length}): ${countInZip.toLocaleString('pt-BR')} arquivos`;
              await new Promise(r => setTimeout(r, 0));
            }
          }
        } catch (zipErr) {
          log(`Aviso: Erro ao abrir arquivo ${zipFile.name}: ${zipErr.message}`, '#f87171');
        }
      }

      log(`Etapa 1 Concluída! Total de Rubricas Únicas Catalogadas: ${rubricasMap.size.toLocaleString('pt-BR')}`, '#4ade80');

      // PASSO 2: Varre todos os ZIPs extraindo as Folhas e cruzando com o Catálogo
      log("Etapa 2/2: Extraindo lançamentos da folha cruzando com a Tabela Global de Rubricas...");
      zipIndex = 0;

      for (let zipFile of selectedFiles) {
        zipIndex++;
        log(`Processando Folhas do ZIP ${zipIndex}/${selectedFiles.length}: ${zipFile.name}...`);

        try {
          const zip = await JSZip.loadAsync(zipFile);
          const allEntries = Object.keys(zip.files).filter(fileName => !zip.files[fileName].dir);

          let countInZip = 0;
          for (let fileName of allEntries) {
            countInZip++;

            try {
              const xmlText = await zip.files[fileName].async('string');

              if (
                xmlText.includes('evtRemun') || 
                xmlText.includes('evtPgtos') || 
                xmlText.includes('evtRscResc') ||
                xmlText.includes('evtTSVE') ||
                xmlText.includes('itensRemun') ||
                xmlText.includes('detPgto') ||
                xmlText.includes('dmDev')
              ) {
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");

                const ideEmpregador = queryNodes(xmlDoc, 'ideEmpregador')[0];
                const cnpjEmpregador = ideEmpregador ? (getNodeVal(ideEmpregador, 'nrInsc') || getNodeVal(ideEmpregador, 'nrInscEstab')) : getNodeVal(xmlDoc, 'nrInsc');

                const cpfTrabalhador = getNodeVal(xmlDoc, 'cpfTrab');
                const perApur = getNodeVal(xmlDoc, 'perApur') || getNodeVal(xmlDoc, 'perRef');

                const itensRemun = [
                  ...queryNodes(xmlDoc, 'itensRemun'),
                  ...queryNodes(xmlDoc, 'detPgto'),
                  ...queryNodes(xmlDoc, 'detVerbras')
                ];

                if (itensRemun.length > 0) {
                  itensRemun.forEach(item => {
                    const codRubr = getNodeVal(item, 'codRubr') || getNodeVal(item, 'tpPgto');
                    const vrRubr = getNodeVal(item, 'vrRubr') || getNodeVal(item, 'vrPgto') || '0';
                    const natRubrXml = getNodeVal(item, 'natRubr');

                    if (codRubr || vrRubr !== '0') {
                      const infoRubrica = rubricasMap.get(codRubr) || {
                        descricao: "Não cadastrada na Tabela de Rubricas",
                        natureza: natRubrXml || "N/A",
                        verbaIndenizatoria: DE_PARA_VERBAS[natRubrXml] || "Verba Remuneratória / Outros"
                      };

                      linhasPlanilha.push({
                        PacoteZip: zipFile.name,
                        ArquivoXML: fileName.split('/').pop(),
                        CNPJEmpregador: cnpjEmpregador,
                        CPFTrabalhador: cpfTrabalhador,
                        PeriodoApuracao: perApur,
                        CodigoRubrica: codRubr,
                        NomeRubrica: infoRubrica.descricao,
                        CodigoNatureza: infoRubrica.natureza,
                        VerbaIndenizatoria: infoRubrica.verbaIndenizatoria,
                        ValorRubrica: parseFloat(vrRubr.replace(',', '.')) || 0
                      });
                    }
                  });
                }
              }
            } catch (errItem) {}

            if (countInZip % 2000 === 0 || countInZip === allEntries.length) {
              const pct = 35 + Math.round(((zipIndex - 1 + (countInZip / allEntries.length)) / selectedFiles.length) * 65);
              progressFill.style.width = `${pct}%`;
              statusPercent.innerText = `${pct}%`;
              statusLabel.innerText = `Lendo Folhas (${zipIndex}/${selectedFiles.length}): ${countInZip.toLocaleString('pt-BR')} arquivos`;
              await new Promise(r => setTimeout(r, 0));
            }
          }
        } catch (zipErr) {}
      }

      log(`Processamento concluído! Total de registros financeiros extraídos: ${linhasPlanilha.length.toLocaleString('pt-BR')}`, '#4ade80');

      if (linhasPlanilha.length === 0) {
        log("Aviso: Nenhuma linha financeira foi identificada nos arquivos do(s) ZIP(s).", '#f87171');
        startBtn.disabled = false;
        return;
      }

      // PASSO 3: Exportar para Excel (.xlsx)
      log("Gerando e formatando planilha Excel consolidada (.xlsx)...");
      const workbook = new ExcelJS.Workbook();
      const worksheet = workbook.addWorksheet('Lançamentos Consolidados');

      worksheet.columns = [
        { header: 'Pacote ZIP Origem', key: 'PacoteZip', width: 25 },
        { header: 'Nome Arquivo XML', key: 'ArquivoXML', width: 35 },
        { header: 'CNPJ Empregador', key: 'CNPJEmpregador', width: 18 },
        { header: 'CPF Trabalhador', key: 'CPFTrabalhador', width: 16 },
        { header: 'Período Apuração', key: 'PeriodoApuracao', width: 15 },
        { header: 'Cód. Rubrica', key: 'CodigoRubrica', width: 15 },
        { header: 'Nome da Rubrica', key: 'NomeRubrica', width: 32 },
        { header: 'Cód. Natureza', key: 'CodigoNatureza', width: 15 },
        { header: 'Cruzamento Verba Indenizatória', key: 'VerbaIndenizatoria', width: 35 },
        { header: 'Valor (R$)', key: 'ValorRubrica', width: 16, style: { numFmt: '"R$"#,##0.00' } }
      ];

      worksheet.getRow(1).font = { bold: true, color: { argb: 'FFFFFF' } };
      worksheet.getRow(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: '1E3A8A' } };

      linhasPlanilha.forEach(linha => worksheet.addRow(linha));

      const buffer = await workbook.xlsx.writeBuffer();
      const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Resultado_Consolidado_eSocial_${new Date().toISOString().slice(0, 10)}.xlsx`;
      a.click();

      log("Planilha consolidada baixada com sucesso!", '#4ade80');
      statusLabel.innerText = "Concluído com Sucesso!";
      startBtn.disabled = false;

    } catch (globalErr) {
      log(`Erro no processamento: ${globalErr.message}`, '#f87171');
      startBtn.disabled = false;
    }
  });
</script>
</body>
</html>
